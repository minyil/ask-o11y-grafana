services:
  grafana:
    image: grafana/grafana:13.1.2
    network_mode: host
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource 3.11.2,esnet-matrix-panel 2.0.1
      - GF_PLUGIN_APP_CLIENT_SECRET=${ASK_O11Y_SA_TOKEN}
      - GF_FEATURE_TOGGLES_ENABLE=externalServiceAccounts
      - GF_AUTH_MANAGED_SERVICE_ACCOUNTS_ENABLED=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_RENDERING_SERVER_URL=http://127.0.0.1:8081/render
      - GF_RENDERING_CALLBACK_URL=http://127.0.0.1:3000/
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN:?Set GRAFANA_RENDERER_TOKEN in .env}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=consensys-asko11y-app,asko11y-plotly-panel,asko11y-simulator-panel,grafana-llm-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana.ini:/etc/grafana/grafana.ini:ro
    restart: unless-stopped

  image-renderer:
    image: grafana/grafana-image-renderer:v5.12.3@sha256:cf36a94431662540a72d2058a43e0cbf72638334475d8216a25a77526a627be7
    network_mode: host
    environment:
      SERVER_ADDR: 127.0.0.1:8081
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:?Set GRAFANA_RENDERER_TOKEN in .env}
      RATE_LIMIT_MIN_LIMIT: "1"
      RATE_LIMIT_MAX_LIMIT: "1"
      GOMEMLIMIT: 256MiB
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    restart: unless-stopped

  csv-server:
    image: nginx:alpine
    ports:
      - "8767:80"
    volumes:
      - ./data/poc:/usr/share/nginx/html:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  grafana-data:
  redis-data:
