# Local integration only. Production must use gVisor or Kata and API authentication.
# Port 8090: 8080 is commonly taken on developer machines.
[server]
host = "127.0.0.1"
port = 8090
max_sandbox_timeout_seconds = 3600

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "sha256:81a92f5c76d19a64b9dc4a55be2f8e86bc12ef9b80266dacdfbc4a9faa1cdf13"

[storage]
allowed_host_paths = ["/var/empty/opensandbox"]
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = ".scratch/opensandbox/state.db"

[docker]
network_mode = "bridge"
port_range_min = 40000
port_range_max = 40100
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 256
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.4"
mode = "dns+nft"
disable_ipv6 = true

[secure_runtime]
type = ""

[renew_intent]
enabled = false
min_interval_seconds = 60
